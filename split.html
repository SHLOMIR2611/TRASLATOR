<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}*{box-sizing:border-box}</style>
</head>
<body>
<title>מתורגמן מסך מפוצל</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: two full-height panels, side by side on wide screens, stacked on phones; optional 180° flip for face-to-face */
:root{
  --bg:#eef1f0; --fg:#1c2422; --muted:#5f6b68; --line:#d3dad8;
  --a:#0f7a6c; --a-soft:#dcefeb; --b:#b45a1c; --b-soft:#f6e6da;
  --card:#ffffff; --danger:#b3261e;
  --font:"Rubik",system-ui,"Segoe UI","Noto Sans","Noto Sans Thai","Noto Sans Devanagari",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --fg:#e7eeec; --muted:#9aa8a4; --line:#2a3532;
  --a:#4cc2b0; --a-soft:#163430; --b:#eb9a5e; --b-soft:#3a2617;
  --card:#1a2220; --danger:#f28b82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --fg:#e7eeec; --muted:#9aa8a4; --line:#2a3532;
  --a:#4cc2b0; --a-soft:#163430; --b:#eb9a5e; --b-soft:#3a2617;
  --card:#1a2220; --danger:#f28b82; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);direction:rtl}
.bar h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.01em}
.bar .tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg .seg-btn{border:0;border-radius:0}
.chip.dir{border-color:var(--a);color:var(--a);font-weight:500}
.panel.listener .controls{visibility:hidden}
.panel.listener .head::after{content:"מאזין";font-size:12px;color:var(--muted);margin-inline-start:auto}
.panel.speaker .head::after{content:"מדבר";font-size:12px;font-weight:500;color:var(--c);margin-inline-start:auto}
.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
@media (max-width:760px){.split{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.panel{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel.A{--c:var(--a);--soft:var(--a-soft);border-inline-end:1px solid var(--line)}
.panel.B{--c:var(--b);--soft:var(--b-soft)}
@media (max-width:760px){.panel.A{border-inline-end:0;border-bottom:2px solid var(--line)}}
body.flip .panel.A{transform:rotate(180deg)}
.head{display:flex;align-items:center;gap:10px}
.tag{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
select{font:inherit;font-size:15px;font-weight:500;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-width:0}
.speakbtn{margin-inline-start:auto}
.log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.msg{max-width:88%;padding:9px 13px;border-radius:14px;line-height:1.45;overflow-wrap:anywhere}
.msg.own{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg.in{align-self:flex-end;background:var(--soft);color:var(--fg);font-size:1.15em;font-weight:500}
.msg.in.pending{opacity:.6;font-style:italic}
.msg.err{color:var(--danger);background:transparent;border:1px dashed var(--danger);font-size:.9em}
.msg.in{position:relative;padding-inline-end:44px}
.replay{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--c);cursor:pointer;display:grid;place-items:center}
.replay:hover{background:var(--card)}
.replay svg{width:20px;height:20px}
.msg small{display:block;font-size:.72em;color:var(--muted);font-weight:400;margin-bottom:2px}
.partial{min-height:1.4em;color:var(--muted);font-style:italic}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:30ch;line-height:1.5}
.controls{display:flex;gap:8px;align-items:center}
.mic{flex:none;width:60px;height:60px;border-radius:50%;border:0;background:var(--c);color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.mic svg{width:26px;height:26px}
.mic.live{animation:pulse 1.2s infinite}
.mic:disabled{opacity:.4;cursor:default}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 55%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none;outline:3px solid var(--c);outline-offset:3px}}
.typed{flex:1;min-width:0;display:flex;gap:6px}
.typed input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.typed button{font:inherit;font-weight:500;border:0;border-radius:12px;padding:0 14px;background:var(--soft);color:var(--fg);cursor:pointer}
.status{font-size:12px;color:var(--muted);min-height:1.2em}
</style>

<div class="bar">
  <h1>מתורגמן למדריך</h1>
  <div class="tools">
    <div class="seg" role="group" aria-label="מצב תרגום">
      <button class="chip seg-btn" id="modeBoth" aria-pressed="true">תרגום כפול</button>
      <button class="chip seg-btn" id="modeOne" aria-pressed="false">חד־כיווני</button>
    </div>
    <button class="chip dir" id="dirBtn" hidden></button>
    <button class="chip" id="flipBtn" aria-pressed="false">פנים מול פנים</button>
    <button class="chip" id="voiceBtn" aria-pressed="true">הקראת תרגום</button>
    <button class="chip" id="claudeVoiceBtn" aria-pressed="false">קול טבעי (Claude)</button>
    <button class="chip" id="clearBtn">ניקוי</button>
  </div>
</div>

<main class="split">
  <section class="panel A" data-side="A"></section>
  <section class="panel B" data-side="B"></section>
</main>

<template id="panelTpl">
  <div class="head">
    <span class="tag"></span>
    <select class="lang" aria-label="Language"></select>
  </div>
  <div class="log" aria-live="polite"></div>
  <div class="partial"></div>
  <div class="controls">
    <button class="mic" aria-label="Speak">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <form class="typed"><input type="text" autocomplete="off"><button type="submit"></button></form>
  </div>
  <div class="status"></div>
</template>

<script>
const LANGS = [
  ["he","עברית"],["en","English"],["ru","Русский"],["ar","العربية"],["fr","Français"],
  ["es","Español"],["de","Deutsch"],["it","Italiano"],["pt","Português"],["uk","Українська"],
  ["pl","Polski"],["ro","Română"],["tr","Türkçe"],["zh","中文"],["ja","日本語"],
  ["ko","한국어"],["th","ไทย"],["hi","हिन्दी"],["am","አማርኛ"],["nl","Nederlands"]
];
const NAME = Object.fromEntries(LANGS);
const ENGLISH = {he:"Hebrew",en:"English",ru:"Russian",ar:"Arabic",fr:"French",es:"Spanish",de:"German",it:"Italian",pt:"Portuguese",uk:"Ukrainian",pl:"Polish",ro:"Romanian",tr:"Turkish",zh:"Chinese (Simplified)",ja:"Japanese",ko:"Korean",th:"Thai",hi:"Hindi",am:"Amharic",nl:"Dutch"};
const RTL = new Set(["he","ar"]);
const UI = {
  he:{tap1:"לחצו על המיקרופון ודברו. התרגום יופיע ויוקרא בצד השני.",wait:"כאן יופיע התרגום.",tap:"לחצו על המיקרופון פעם אחת. שני הצדדים מקשיבים יחד, וכל משפט מתורגם לצד השני לפי השפה שבה נאמר.",send:"שלח",ph:"או הקלידו כאן…",listen:"מקשיב לשני הצדדים…",tr:"מתרגם…",nomic:"מיקרופון לא זמין כאן, אפשר להקליד.",speaking:"מקריא את התרגום… ואז חוזר להאזנה",resume:"לחצו על המיקרופון כדי להמשיך",said:"אמרתם"},
  en:{tap1:"Tap the mic and speak. The translation appears and is read aloud on the other side.",wait:"The translation will appear here.",tap:"Tap the mic once. Both sides listen together, and each sentence is translated to the other side by the language it was spoken in.",send:"Send",ph:"Or type here…",listen:"Listening to both sides…",tr:"Translating…",nomic:"Microphone not available here. You can type.",speaking:"Reading the translation… then listening again",resume:"Tap the mic to continue",said:"You said"},
  ru:{tap:"Нажмите на микрофон и говорите. Перевод появится на другой стороне.",send:"Отпр.",ph:"Или введите текст…",listen:"Слушаю…",tr:"Перевожу…",nomic:"Микрофон недоступен. Можно печатать.",said:"Вы сказали"},
  ar:{tap:"اضغط على الميكروفون وتحدث. ستظهر الترجمة في الجهة الأخرى.",send:"إرسال",ph:"أو اكتب هنا…",listen:"أستمع…",tr:"أترجم…",nomic:"الميكروفون غير متاح. يمكنك الكتابة.",said:"قلت"},
  fr:{tap:"Appuyez sur le micro et parlez. La traduction s'affiche de l'autre côté.",send:"Envoyer",ph:"Ou tapez ici…",listen:"J'écoute…",tr:"Traduction…",nomic:"Micro indisponible. Vous pouvez taper.",said:"Vous avez dit"},
  es:{tap:"Toca el micrófono y habla. La traducción aparece del otro lado.",send:"Enviar",ph:"O escribe aquí…",listen:"Escuchando…",tr:"Traduciendo…",nomic:"Micrófono no disponible. Puedes escribir.",said:"Dijiste"},
  de:{tap:"Mikrofon antippen und sprechen. Die Übersetzung erscheint auf der anderen Seite.",send:"Senden",ph:"Oder hier tippen…",listen:"Höre zu…",tr:"Übersetze…",nomic:"Mikrofon nicht verfügbar. Sie können tippen.",said:"Sie sagten"}
};
const ui = l => UI[l] || UI.en;

const state = { A:{lang:"he"}, B:{lang:"en"} };
try{ const s=JSON.parse(localStorage.getItem("interp-langs")||"null"); if(s&&NAME[s.A]&&NAME[s.B]){state.A.lang=s.A;state.B.lang=s.B;} }catch(e){}
const other = s => s==="A"?"B":"A";
// Inside Claude the page uses Claude's dictation, translation and voice. Opened anywhere else (e.g. GitHub Pages)
// it falls back to the browser's speech recognition, Google Translate and the browser's voices.
const STANDALONE = !(window.claude && typeof window.claude.use==="function");
let speakOut = true, claudeVoice = false, pausedForVoice = false, autoResume = false;
let mode = "both", oneSrc = "A";
try{ const m=JSON.parse(localStorage.getItem("interp-mode")||"null"); if(m&&(m.mode==="both"||m.mode==="one")){ mode=m.mode; oneSrc=m.src==="B"?"B":"A"; } }catch(e){}
let dict=null, sample=null, tts=null;
let listeningSide=null, requestedSide=null, dictChecked=false;
const queues = {A:Promise.resolve(), B:Promise.resolve()};

const panels = {};
for (const side of ["A","B"]){
  const root=document.querySelector(`.panel.${side}`);
  root.appendChild(document.getElementById("panelTpl").content.cloneNode(true));
  const p = {root, sel:root.querySelector(".lang"), log:root.querySelector(".log"), partial:root.querySelector(".partial"),
    mic:root.querySelector(".mic"), form:root.querySelector(".typed"), input:root.querySelector(".typed input"),
    send:root.querySelector(".typed button"), status:root.querySelector(".status")};
  p.sel.id="lang"+side; p.input.id="text"+side;
  for(const [c,n] of LANGS){ const o=document.createElement("option"); o.value=c; o.textContent=n; p.sel.appendChild(o); }
  p.sel.value=state[side].lang;
  p.sel.addEventListener("change",()=>{ state[side].lang=p.sel.value; saveLangs(); applyLang(side); });
  p.form.addEventListener("submit",e=>{ e.preventDefault(); const t=p.input.value.trim(); if(!t) return; p.input.value=""; handleUtterance(side,t); });
  p.mic.addEventListener("click",()=>toggleMic(side));
  panels[side]=p;
  applyLang(side);
}
function saveLangs(){ try{localStorage.setItem("interp-langs",JSON.stringify({A:state.A.lang,B:state.B.lang}))}catch(e){} }
function applyLang(side){
  const p=panels[side], l=state[side].lang, u=ui(l);
  p.root.dir = RTL.has(l)?"rtl":"ltr"; p.root.lang=l;
  p.input.placeholder=u.ph; p.send.textContent=u.send;
  if(!p.log.querySelector(".msg")){
    const one = typeof mode!=="undefined" && mode==="one";
    p.log.innerHTML=`<div class="empty"></div>`;
    p.log.firstChild.textContent = !one ? u.tap : side===oneSrc ? (u.tap1||UI.en.tap1) : (u.wait||UI.en.wait);
  }
  if(!dict && dictChecked) p.status.textContent=u.nomic;
}
function addMsg(side, cls, text, label){
  const p=panels[side]; const empty=p.log.querySelector(".empty"); if(empty) empty.remove();
  const d=document.createElement("div"); d.className="msg "+cls;
  if(label){ const s=document.createElement("small"); s.textContent=label; d.appendChild(s); }
  const t=document.createElement("span"); t.textContent=text; d.appendChild(t);
  p.log.appendChild(d); p.log.scrollTop=p.log.scrollHeight; return {el:d, set(v){t.textContent=v; p.log.scrollTop=p.log.scrollHeight;}};
}

function handleUtterance(side, text){
  text=text.trim(); if(!text) return;
  const to=other(side), from=state[side].lang, target=state[to].lang;
  addMsg(side,"own",text);
  const bubble=addMsg(to,"in pending",ui(target).tr);
  bubble.el.querySelector("small")?.remove();
  queues[to]=queues[to].then(()=>translate(text,from,target,bubble,to));
}
async function translate(text,from,target,bubble,to){
  if(from===target){ bubble.el.classList.remove("pending"); bubble.set(text); return; }
  if(STANDALONE){
    try{
      const out=await gTranslate(text,from,target);
      bubble.el.classList.remove("pending"); bubble.set(out); addReplay(bubble,out,target);
      if(out) speakText(out,target);
    }catch(e){ bubble.el.className="msg err"; bubble.set("Translation failed. Check the internet connection."); }
    return;
  }
  if(!sample){ bubble.el.className="msg err"; bubble.set("Translation is not available in this view."); return; }
  const prompt=`You are a live interpreter for a tour guide. Translate the following spoken ${ENGLISH[from]} text into ${ENGLISH[target]}. It is speech-to-text output, so fix obvious recognition slips and punctuation. Keep the meaning and tone, keep names of places as commonly written in ${ENGLISH[target]}. Write it the way a skilled human interpreter would say it out loud: natural, conversational, idiomatic, short clear sentences, not word-for-word. Spell out numbers and abbreviations the way they are spoken. Reply with the translation only, no quotes, no notes.\n\nText:\n${text}`;
  try{
    const r=await sample(prompt,{modelTier:"quick",onText:({text:t})=>{ if(t){bubble.el.classList.remove("pending"); bubble.set(t);} }});
    const out=(r.text||"").trim(); bubble.el.classList.remove("pending"); bubble.set(out); addReplay(bubble,out,target);
    if(out) speakText(out,target);
  }catch(e){
    bubble.el.className="msg err";
    bubble.set(e&&e.code==="rate_limited"?"Too many requests, wait a moment and try again.":e&&e.code==="not_granted"?"Translation was not allowed for this page.":"Translation failed. Try again.");
  }
}

function setMicUI(){
  for(const s of ["A","B"]){
    const p=panels[s], live=!!listeningSide;
    p.mic.classList.toggle("live",live);
    p.mic.disabled=!dict;
    p.mic.setAttribute("aria-pressed",live?"true":"false");
    if(dict) p.status.textContent= (synthSpeaking||autoResume) ? (ui(state[s].lang).speaking||UI.en.speaking) : live? ui(state[s].lang).listen : pausedForVoice ? (ui(state[s].lang).resume||UI.en.resume) : "";
    if(!live) p.partial.textContent="";
  }
}
// One shared microphone listens to both people; each phrase is routed by the language it was spoken in.
function toggleMic(side){
  if(!dict) return;
  unlockSynth(); pausedForVoice=false; autoResume=false;
  if(listeningSide){ dict.stop(); return; }
  requestedSide="both";
  const opts = micOptions();
  dict.start(opts).catch(err=>{
    if(err&&err.code==="unavailable"&&opts){ dict.start().catch(()=>{}); return; }
    if(err&&err.code!=="stopped"){ const m=err.code==="not_granted"?"Microphone permission was refused.":err.code==="unavailable"?"Dictation is not available here. You can type.":"Microphone error, try again."; panels.A.status.textContent=m; panels.B.status.textContent=m; }
  });
}

let buf="", flushTimer=null;
// Read translations aloud. While the shared mic is open the platform voice is busy, so the browser's own voice is used,
// and anything the mic hears while it plays (plus a short tail) is ignored so the translation is not translated back.
const synth = window.speechSynthesis || null;
let synthSpeaking=false, muteUntil=0, synthUnlocked=false;
const LOCALE={he:"he-IL",en:"en-US",ru:"ru-RU",ar:"ar-SA",fr:"fr-FR",es:"es-ES",de:"de-DE",it:"it-IT",pt:"pt-PT",uk:"uk-UA",pl:"pl-PL",ro:"ro-RO",tr:"tr-TR",zh:"zh-CN",ja:"ja-JP",ko:"ko-KR",th:"th-TH",hi:"hi-IN",am:"am-ET",nl:"nl-NL"};
function unlockSynth(){
  if(!synth||synthUnlocked) return;
  try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; synth.speak(u); synthUnlocked=true; }catch(e){}
}
// Prefer the most human-sounding voice the device has: neural/online voices first, robotic engines last.
let voiceCache=[];
function loadVoices(){ try{ voiceCache=synth?synth.getVoices():[]; }catch(e){ voiceCache=[]; } }
if(synth){ loadVoices(); try{ synth.addEventListener("voiceschanged",loadVoices); }catch(e){} }
function voiceScore(v,lang){
  const n=(v.name||""), l=(v.lang||"").toLowerCase();
  let sc=0;
  if(/natural|neural/i.test(n)) sc+=10;
  if(/online/i.test(n)) sc+=6;
  if(/premium|enhanced|siri/i.test(n)) sc+=6;
  if(/google/i.test(n)) sc+=4;
  if(!v.localService) sc+=2;
  if(l===(LOCALE[lang]||"").toLowerCase()) sc+=1;
  if(/compact|espeak|robot|novelty/i.test(n)) sc-=10;
  return sc;
}
function pickVoice(lang){
  if(!voiceCache.length) loadVoices();
  const vs=voiceCache.filter(v=>v.lang&&v.lang.toLowerCase().replace("_","-").startsWith(lang));
  vs.sort((a,b)=>voiceScore(b,lang)-voiceScore(a,lang));
  return vs[0]||null;
}
function micMuted(){ return synthSpeaking || Date.now()<muteUntil; }
// Read every translation aloud.
// Mic closed: Claude's voice (falls back to the browser voice).
// Mic open: the browser voice for that language, so listening continues; if the device has no voice
// for that language, pause the mic and use Claude's voice instead (tap the mic to continue).
let synthWatch=null;
function releaseSynth(){ clearTimeout(synthWatch); synthSpeaking=false; muteUntil=Date.now()+1200; setMicUI(); }
function showSpeaking(){ for(const s of ["A","B"]) panels[s].status.textContent=(ui(state[s].lang).speaking||UI.en.speaking); }
function speakSynth(text,lang,v){
  if(!synth) return false;
  try{ synth.cancel(); }catch(e){}
  const parts=(text.match(/[^.!?。！？؟\n]+[.!?。！？؟]*\s*/g)||[text]).map(x=>x.trim()).filter(Boolean);
  synthSpeaking=true; showSpeaking();
  clearTimeout(synthWatch);
  synthWatch=setTimeout(releaseSynth, 4000 + text.length*120);
  parts.forEach((part,i)=>{
    const u=new SpeechSynthesisUtterance(part);
    u.lang=LOCALE[lang]||lang; if(v) u.voice=v; u.rate=0.96; u.pitch=1;
    if(i===parts.length-1){ u.onend=releaseSynth; }
    u.onerror=releaseSynth;
    synth.speak(u);
  });
  return true;
}
function speakClaude(text,lang,v){
  return tts.speak(text,{language:lang}).catch(()=>{ speakSynth(text,lang,v); });
}
// After Claude's voice finishes, go straight back to listening.
function micOptions(){ return mode==="one" ? {language:state[oneSrc].lang} : undefined; }
function resumeListening(){
  if(!dict || listeningSide) return;
  const opts=micOptions();
  dict.start(opts).then(()=>{ pausedForVoice=false; setMicUI(); }).catch(err=>{
    if(err&&err.code==="unavailable"&&opts){ dict.start().then(()=>{pausedForVoice=false;setMicUI();}).catch(()=>{ pausedForVoice=true; setMicUI(); }); return; }
    pausedForVoice=true; setMicUI();   // the browser wants a tap: the mic shows "tap to continue"
  });
}
function speakText(text,lang){
  if(!speakOut||!text) return;
  const v = synth ? pickVoice(lang) : null;
  if(listeningSide){
    if(v && !claudeVoice){ speakSynth(text,lang,v); return; }
    if(tts){
      autoResume=true; showSpeaking();
      dict.stop().then(()=>speakClaude(text,lang,v)).then(()=>{ if(autoResume){ autoResume=false; resumeListening(); } }).catch(()=>speakSynth(text,lang,v));
      return;
    }
    speakSynth(text,lang,v);
    return;
  }
  if(tts) speakClaude(text,lang,v); else speakSynth(text,lang,v);
}
// Replay button on each translation
function addReplay(bubble,text,lang){
  if(!text||bubble.el.querySelector(".replay")) return;
  const b=document.createElement("button");
  b.className="replay"; b.type="button"; b.setAttribute("aria-label","השמע שוב"); b.title="השמע שוב";
  b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>';
  b.addEventListener("click",()=>{ unlockSynth(); const was=speakOut; speakOut=true; speakText(text,lang); speakOut=was; });
  bubble.el.appendChild(b);
}
function queueSpeech(text){
  if(micMuted()) return;
  buf += text;
  clearTimeout(flushTimer);
  flushTimer=setTimeout(flushSpeech,1300);
}
function flushSpeech(){
  clearTimeout(flushTimer);
  const t=buf.trim(); buf="";
  if(!t) return;
  if(mode==="one") handleUtterance(oneSrc,t); else routeAndTranslate(t);
}
let chain=Promise.resolve();
function routeAndTranslate(text){
  const la=state.A.lang, lb=state.B.lang;
  chain=chain.then(async()=>{
    if(!sample && !STANDALONE){ addMsg("A","err","Translation is not available in this view."); return; }
    const pa=addMsg("A","in pending",ui(la).tr), pb=addMsg("B","in pending",ui(lb).tr);
    const prompt=`You are a live interpreter between a tour guide and a visitor. Two languages are in use: A = ${ENGLISH[la]}, B = ${ENGLISH[lb]}.
Below is a phrase captured by speech-to-text from a shared microphone. The speaker always uses one of these two languages only. Decide whether it was spoken in A or in B. The recognizer may be tuned to one language, so speech in the other language can come out as phonetic gibberish or be transliterated into the wrong script (for example English words written in Hebrew letters, or Hebrew written in Latin letters); in that case read it by sound, decide the real language, and reconstruct what was actually said. Clean obvious recognition slips and punctuation, then translate it into the other language. Keep meaning and tone; write place names as commonly written in the target language. Write it the way a skilled human interpreter would say it out loud: natural, conversational, idiomatic, short clear sentences, not word-for-word. Spell out numbers and abbreviations the way they are spoken.
Reply with JSON only: {"source":"A" or "B","original":"<cleaned phrase in the source language>","translation":"<translation in the other language>"}

Phrase:
${text}`;
    try{
      const r= STANDALONE ? await gRoute(text,la,lb) : await sample.json(prompt,{modelTier:"quick",cache:false});
      const src=r&&r.source==="B"?"B":"A", dst=other(src);
      const ownBubble = src==="A"?pa:pb, inBubble = src==="A"?pb:pa;
      ownBubble.el.className="msg own"; ownBubble.set((r.original||text).trim());
      const tagEl=document.createElement("small"); tagEl.textContent=NAME[state[src].lang]; ownBubble.el.prepend(tagEl);
      inBubble.el.className="msg in"; inBubble.set((r.translation||"").trim()); addReplay(inBubble,(r.translation||"").trim(),state[dst].lang);
      if(r.translation) speakText(r.translation.trim(),state[dst].lang);
    }catch(e){
      pa.el.remove(); pb.el.className="msg err";
      pb.set(e&&e.code==="rate_limited"?"Too many requests, wait a moment.":"Translation failed: "+text);
    }
  });
}

// ---- standalone helpers ----
const GCODE = c => c==="zh" ? "zh-CN" : c;
async function gRaw(text,sl,tl){
  const url="https://translate.googleapis.com/translate_a/single?client=gtx&sl="+sl+"&tl="+GCODE(tl)+"&dt=t&q="+encodeURIComponent(text);
  const res=await fetch(url); if(!res.ok) throw new Error("Google "+res.status);
  const data=await res.json();
  return {text:(data[0]||[]).map(x=>x[0]).join(""), detected:String(data[2]||"")};
}
async function gMyMemory(text,from,to){
  const res=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+from+"|"+GCODE(to));
  const d=await res.json(); if(!d.responseData||!d.responseData.translatedText) throw new Error("MyMemory");
  return d.responseData.translatedText;
}
async function gTranslate(text,from,to){
  try{ return (await gRaw(text,GCODE(from),to)).text; }catch(e){ return await gMyMemory(text,from,to); }
}
// Two-way: let Google detect which of the two languages was spoken, then translate to the other one.
async function gRoute(text,la,lb){
  const first=await gRaw(text,"auto",lb);
  const det=first.detected.toLowerCase().split("-")[0];
  const base=c=>GCODE(c).toLowerCase().split("-")[0];
  if(det===base(lb)){ return {source:"B",original:text,translation:await gTranslate(text,lb,la)}; }
  return {source:"A",original:text,translation:first.text};
}
// Browser speech recognition shaped like Claude's dictation, so the rest of the page works unchanged.
function makeWebDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return null;
  let rec=null, active=false, cur="idle", lang="he";
  const hs={state:[],partial:[],final:[]};
  const emit=(k,e)=>hs[k].forEach(f=>{ try{f(e)}catch(x){} });
  const setState=(st,reason)=>{ cur=st; emit("state",reason?{state:st,reason}:{state:st}); };
  function begin(){
    rec=new SR(); rec.lang=LOCALE[lang]||lang; rec.continuous=true; rec.interimResults=true;
    rec.onresult=ev=>{
      let interim="";
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const r=ev.results[i];
        if(r.isFinal) emit("final",{text:" "+r[0].transcript.trim()}); else interim+=r[0].transcript;
      }
      emit("partial",{text:interim});
    };
    rec.onerror=ev=>{ if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){ active=false; setState("idle","not_granted"); } };
    rec.onend=()=>{ if(active) setTimeout(()=>{ try{ begin(); }catch(e){} },150); else setState("idle","stopped"); };
    try{ rec.start(); }catch(e){}
  }
  return {
    start(opts){
      lang=(opts&&opts.language)||(mode==="one"?state[oneSrc].lang:state.A.lang);
      if(active) return Promise.resolve();
      active=true; setState("starting"); begin(); setState("listening");
      return Promise.resolve();
    },
    stop(){ active=false; if(rec){ try{ rec.stop(); }catch(e){} } else setState("idle","stopped"); return Promise.resolve(); },
    active(){ return cur!=="idle"; },
    onState(f){ hs.state.push(f); return ()=>{}; },
    onPartial(f){ hs.partial.push(f); return ()=>{}; },
    onFinal(f){ hs.final.push(f); return ()=>{}; }
  };
}

(async()=>{
  const [d,s,t]= STANDALONE ? [makeWebDictation(),null,null] : await Promise.all([claude.use("dictation"),claude.use("sample"),claude.use("tts")]);
  dict=d; sample=s; tts=t; dictChecked=true;
  if(!tts && !synth){ const vb=document.getElementById("voiceBtn"); vb.hidden=true; }
  if(!tts) document.getElementById("claudeVoiceBtn").hidden=true;
  if(dict){
    dict.onState(({state:st})=>{
      if(st==="starting") listeningSide=requestedSide;
      if(st==="idle"){ listeningSide=null; flushSpeech(); }
      setMicUI();
    });
    dict.onPartial(({text})=>{ if(micMuted()) return; panels.A.partial.textContent=text; panels.B.partial.textContent=text; if(text) clearTimeout(flushTimer); else if(buf) flushTimer=setTimeout(flushSpeech,1300); });
    dict.onFinal(({text})=>queueSpeech(text));
  }
  setMicUI();
  for(const s of ["A","B"]) applyLang(s);
})();

function applyMode(){
  const one = mode==="one";
  document.getElementById("modeBoth").setAttribute("aria-pressed",!one);
  document.getElementById("modeOne").setAttribute("aria-pressed",one);
  const dir=document.getElementById("dirBtn");
  dir.hidden=!one;
  dir.textContent = NAME[state[oneSrc].lang]+" ← "+NAME[state[other(oneSrc)].lang]+"  ⇄";
  dir.setAttribute("aria-label","החלפת כיוון התרגום");
  for(const s of ["A","B"]){
    panels[s].root.classList.toggle("speaker", one && s===oneSrc);
    panels[s].root.classList.toggle("listener", one && s!==oneSrc);
  }
  for(const s of ["A","B"]) applyLang(s);
  try{ localStorage.setItem("interp-mode",JSON.stringify({mode,src:oneSrc})); }catch(e){}
}
function setMode(m,src){
  const changed = m!==mode || (src && src!==oneSrc);
  mode=m; if(src) oneSrc=src;
  if(changed && dict && listeningSide){ dict.stop(); }
  applyMode();
}
document.getElementById("modeBoth").addEventListener("click",()=>setMode("both"));
document.getElementById("modeOne").addEventListener("click",()=>setMode("one"));
document.getElementById("dirBtn").addEventListener("click",()=>setMode("one",other(oneSrc)));
for(const s of ["A","B"]) panels[s].sel.addEventListener("change",applyMode);
applyMode();
document.getElementById("flipBtn").addEventListener("click",e=>{
  const on=document.body.classList.toggle("flip"); e.currentTarget.setAttribute("aria-pressed",on);
});
document.getElementById("voiceBtn").addEventListener("click",e=>{
  speakOut=!speakOut; e.currentTarget.setAttribute("aria-pressed",speakOut); unlockSynth();
  if(!speakOut){ if(tts) tts.stop(); if(synth) synth.cancel(); synthSpeaking=false; }
});
document.getElementById("claudeVoiceBtn").addEventListener("click",e=>{
  claudeVoice=!claudeVoice; e.currentTarget.setAttribute("aria-pressed",claudeVoice);
});
document.getElementById("clearBtn").addEventListener("click",()=>{
  for(const s of ["A","B"]){ panels[s].log.innerHTML=""; applyLang(s); }
});
</script>
