<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="שיחה מתורגמת">
<title>שיחה מתורגמת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one conversation column. Top: the two languages. Middle: chat bubbles (side = who spoke). Bottom: one big mic. */
:root{
  --bg:#f1f3f2; --fg:#1b2321; --muted:#617069; --line:#d5dcd9; --card:#ffffff;
  --a:#0f7a6c; --a-soft:#dcefeb; --b:#b45a1c; --b-soft:#f6e6da; --danger:#b3261e;
  --font:"Rubik",system-ui,"Segoe UI","Noto Sans",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111715; --fg:#e6eeeb; --muted:#97a6a1; --line:#29332f; --card:#19211f;
  --a:#4cc2b0; --a-soft:#14322d; --b:#eb9a5e; --b-soft:#382516; --danger:#f28b82; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{border-bottom:1px solid var(--line);background:var(--card)}
header .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:10px}
h1{font-size:16px;margin:0;font-weight:700}
.langs{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.lang{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:4px 8px;background:var(--bg)}
.lang .dot{width:10px;height:10px;border-radius:50%}
.lang.A .dot{background:var(--a)} .lang.B .dot{background:var(--b)}
.lang.expect{outline:2px solid currentColor}
.lang.A.expect{color:var(--a)} .lang.B.expect{color:var(--b)}
select{font:inherit;font-weight:500;border:0;background:transparent;color:var(--fg);padding:4px 2px}
button{font:inherit;cursor:pointer}
.icon{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px}
.icon[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
details.settings{width:100%;font-size:13px;color:var(--muted)}
details.settings summary{cursor:pointer}
details.settings .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
details.settings input{font:inherit;min-width:0;flex:1;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
main{flex:1;min-height:0;overflow-y:auto}
.log{display:flex;flex-direction:column;gap:12px;padding-block:16px;max-width:820px;margin:0 auto}
.empty{color:var(--muted);text-align:center;margin:12vh auto 0;max-width:36ch;line-height:1.6}
.bubble{max-width:86%;border-radius:16px;padding:10px 14px 10px 44px;position:relative;background:var(--card);border:1px solid var(--line)}
.bubble.A{align-self:flex-start;border-inline-start:4px solid var(--a)}
.bubble.B{align-self:flex-end;border-inline-start:4px solid var(--b)}
.bubble .orig{font-size:13px;color:var(--muted);margin-bottom:4px;overflow-wrap:anywhere}
.bubble .orig b{font-weight:500}
.bubble .tr{font-size:1.25em;font-weight:500;line-height:1.4;overflow-wrap:anywhere}
.bubble.pending .tr{color:var(--muted);font-style:italic}
.bubble.err .tr{color:var(--danger);font-size:1em}
.replay{position:absolute;left:6px;top:8px;width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.replay:hover{background:var(--bg);color:var(--fg)}
.replay svg{width:20px;height:20px}
footer{border-top:1px solid var(--line);background:var(--card)}
footer .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
.mic{flex:none;width:68px;height:68px;border-radius:50%;border:0;background:var(--a);color:#fff;display:grid;place-items:center}
.mic svg{width:30px;height:30px}
.mic.live{animation:pulse 1.2s infinite}
.mic.B{background:var(--b)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,122,108,.45)}100%{box-shadow:0 0 0 18px rgba(15,122,108,0)}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none;outline:3px solid var(--fg);outline-offset:3px}}
.statusbox{flex:1;min-width:0}
.status{font-weight:500}
.partial{color:var(--muted);font-style:italic;min-height:1.3em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warn{background:var(--b-soft);color:var(--fg);padding:10px 14px;border-radius:12px;margin:12px auto;max-width:820px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>שיחה מתורגמת</h1>
    <div class="langs">
      <label class="lang A" id="chipA" title="שפה ראשונה"><span class="dot"></span><select id="langA" aria-label="שפה ראשונה"></select></label>
      <button class="icon" id="swap" aria-label="החלפת השפות">⇄</button>
      <label class="lang B" id="chipB" title="שפה שנייה"><span class="dot"></span><select id="langB" aria-label="שפה שנייה"></select></label>
    </div>
    <div class="tools">
      <button class="icon" id="speakBtn" aria-pressed="true">הקראה</button>
      <button class="icon" id="clearBtn">ניקוי</button>
    </div>
    <details class="settings">
      <summary>הגדרות מתקדמות</summary>
      <div class="row">
        <label for="apikey">מפתח Claude API (רשות, לזיהוי ותרגום מדויקים יותר):</label>
        <input id="apikey" type="password" autocomplete="off" placeholder="sk-ant-…">
      </div>
      <div class="row">
        <label for="rate">מהירות הקראה:</label>
        <select id="rate"><option value="0.9">איטית</option><option value="1.05">רגילה</option><option value="1.2">מהירה</option><option value="1.35">מהירה מאוד</option></select>
      </div>
      <div class="row" id="voiceRow"></div>
    </details>
  </div>
</header>

<main id="main">
  <div class="wrap">
    <div id="warn" class="warn" hidden>הדפדפן הזה לא תומך בזיהוי דיבור. פתחו את הדף ב־Chrome או ב־Edge.</div>
    <div class="log" id="log">
      <div class="empty" id="empty">בחרו שתי שפות ולחצו על המיקרופון פעם אחת.<br>כל משפט מזוהה לפי השפה שבה נאמר, מתורגם לשפה השנייה ומוקרא בקול. אחרי כל תרגום הדף מתכונן לתשובה בשפה השנייה.</div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <button class="mic" id="mic" aria-label="התחלת האזנה" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <div class="statusbox">
      <div class="status" id="status">לחצו כדי להתחיל להקשיב</div>
      <div class="partial" id="partial"></div>
    </div>
  </div>
</footer>

<script>
// ---------- languages ----------
const LANGS = [
  {c:"he",n:"עברית",en:"Hebrew",sr:"he-IL",g:"iw"},{c:"en",n:"English",en:"English",sr:"en-US",g:"en"},
  {c:"ru",n:"Русский",en:"Russian",sr:"ru-RU",g:"ru"},{c:"ar",n:"العربية",en:"Arabic",sr:"ar-SA",g:"ar"},
  {c:"fr",n:"Français",en:"French",sr:"fr-FR",g:"fr"},{c:"es",n:"Español",en:"Spanish",sr:"es-ES",g:"es"},
  {c:"de",n:"Deutsch",en:"German",sr:"de-DE",g:"de"},{c:"it",n:"Italiano",en:"Italian",sr:"it-IT",g:"it"},
  {c:"pt",n:"Português",en:"Portuguese",sr:"pt-PT",g:"pt"},{c:"uk",n:"Українська",en:"Ukrainian",sr:"uk-UA",g:"uk"},
  {c:"pl",n:"Polski",en:"Polish",sr:"pl-PL",g:"pl"},{c:"ro",n:"Română",en:"Romanian",sr:"ro-RO",g:"ro"},
  {c:"tr",n:"Türkçe",en:"Turkish",sr:"tr-TR",g:"tr"},{c:"zh",n:"中文",en:"Chinese (Simplified)",sr:"zh-CN",g:"zh-CN"},
  {c:"ja",n:"日本語",en:"Japanese",sr:"ja-JP",g:"ja"},{c:"ko",n:"한국어",en:"Korean",sr:"ko-KR",g:"ko"},
  {c:"th",n:"ไทย",en:"Thai",sr:"th-TH",g:"th"},{c:"hi",n:"हिन्दी",en:"Hindi",sr:"hi-IN",g:"hi"},
  {c:"am",n:"አማርኛ",en:"Amharic",sr:"am-ET",g:"am"},{c:"nl",n:"Nederlands",en:"Dutch",sr:"nl-NL",g:"nl"}
];
const L = c => LANGS.find(x=>x.c===c) || LANGS[0];
const RTL = new Set(["he","ar"]);
const $ = id => document.getElementById(id);

let A="he", B="en";
try{ const s=JSON.parse(localStorage.getItem("conv-langs")||"null"); if(s&&L(s.A).c===s.A&&L(s.B).c===s.B){A=s.A;B=s.B;} }catch(e){}
try{ $("apikey").value=localStorage.getItem("conv-key")||""; }catch(e){}
for(const id of ["langA","langB"]) for(const l of LANGS){ const o=document.createElement("option"); o.value=l.c; o.textContent=l.n; $(id).appendChild(o); }
$("langA").value=A; $("langB").value=B;
function saveLangs(){ try{ localStorage.setItem("conv-langs",JSON.stringify({A,B})); }catch(e){} }
$("langA").onchange=()=>{ A=$("langA").value; saveLangs(); expect="A"; restartRec(); paintExpect(); };
$("langB").onchange=()=>{ B=$("langB").value; saveLangs(); expect="A"; restartRec(); paintExpect(); };
$("swap").onclick=()=>{ [A,B]=[B,A]; $("langA").value=A; $("langB").value=B; saveLangs(); restartRec(); paintExpect(); };
$("apikey").onchange=()=>{ try{ localStorage.setItem("conv-key",$("apikey").value.trim()); }catch(e){} };
// Tap a language chip to tell the page who is about to speak.
$("chipA").addEventListener("click",e=>{ if(e.target.tagName!=="SELECT"){ expect="A"; restartRec(); paintExpect(); } });
$("chipB").addEventListener("click",e=>{ if(e.target.tagName!=="SELECT"){ expect="B"; restartRec(); paintExpect(); } });
const langOf = side => side==="A"?A:B;
const other = side => side==="A"?"B":"A";

// ---------- translation + language detection ----------
async function gRaw(text,sl,tl){
  const url="https://translate.googleapis.com/translate_a/single?client=gtx&sl="+sl+"&tl="+tl+"&dt=t&q="+encodeURIComponent(text);
  const r=await fetch(url); if(!r.ok) throw new Error("Google "+r.status);
  const d=await r.json();
  return {text:(d[0]||[]).map(x=>x[0]).join(""), detected:String(d[2]||"").toLowerCase()};
}
async function gMyMemory(text,from,to){
  const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+from+"|"+L(to).g);
  const d=await r.json(); if(!d.responseData||!d.responseData.translatedText) throw new Error("MyMemory");
  return d.responseData.translatedText;
}
const base = g => g.split("-")[0].replace(/^iw$/,"he");
// Free engine: Google detects which of the two languages was spoken, then translates to the other.
// Free engine: translate both directions at once and keep the one Google says matches the spoken language
// (one round trip instead of two). Results are cached, so a phrase pre-translated while still being spoken is instant.
const cache=new Map();
function routeFree(text){
  const heardAs=expect, key=A+"|"+B+"|"+heardAs+"|"+text.trim();
  if(cache.has(key)) return cache.get(key);
  const p=(async()=>{
    const toB=gRaw(text,"auto",L(B).g), toA=gRaw(text,"auto",L(A).g);
    try{
      const [rb,ra]=await Promise.all([toB,toA]);
      const det=base(rb.detected||ra.detected);
      if(det===base(L(B).g)) return {source:"B",original:text,translation:ra.text};
      if(det===base(L(A).g)) return {source:"A",original:text,translation:rb.text};
      return heardAs==="A" ? {source:"A",original:text,translation:rb.text} : {source:"B",original:text,translation:ra.text};
    }catch(e){
      return {source:heardAs,original:text,translation:await gMyMemory(text,L(langOf(heardAs)).g,langOf(other(heardAs)))};
    }
  })();
  cache.set(key,p); p.catch(()=>cache.delete(key));
  if(cache.size>60) cache.delete(cache.keys().next().value);
  return p;
}
let prefetchT=null;
function prefetch(text){
  clearTimeout(prefetchT);
  const t=(buf+" "+text).trim();
  if(t.length<4||$("apikey").value.trim()) return;
  prefetchT=setTimeout(()=>{ routeFree(t).catch(()=>{}); },250);
}
// Claude engine (optional key): decides the language even when the recognizer mangled it, and translates naturally.
async function routeClaude(text,key){
  const la=L(A).en, lb=L(B).en;
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
    "Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:400,
      system:`You are a live interpreter between two people. Language A = ${la}, language B = ${lb}. You get one phrase from browser speech-to-text that was listening in ${L(langOf(expect)).en}. The speaker used A or B only. If the phrase looks like the other language came out garbled or transliterated into the wrong script, judge by sound and reconstruct what was said. Read aloud recently by the device (ignore if the phrase is just this): ${JSON.stringify(spoken.map(s=>s.text))}. Translate into the other language the way a skilled human interpreter would say it aloud: natural, idiomatic, short sentences. Reply with JSON only: {"source":"A"|"B"|"echo","original":"...","translation":"..."}`,
      messages:[{role:"user",content:text}]})});
  const d=await res.json(); if(d.error) throw new Error(d.error.message);
  const raw=d.content.map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
  return JSON.parse(raw);
}

// ---------- chat bubbles ----------
function bubble(side){
  $("empty")?.remove();
  const el=document.createElement("div"); el.className="bubble pending "+side;
  el.innerHTML='<div class="orig"></div><div class="tr"></div>';
  el.querySelector(".tr").textContent="מתרגם…";
  $("log").appendChild(el); $("main").scrollTop=$("main").scrollHeight;
  return el;
}
function fillBubble(el,side,orig,tr){
  const src=L(langOf(side)), dst=L(langOf(other(side)));
  el.className="bubble "+side;
  const o=el.querySelector(".orig"); o.dir=RTL.has(src.c)?"rtl":"ltr";
  o.innerHTML=""; const b=document.createElement("b"); b.textContent=src.n+": "; o.append(b, document.createTextNode(orig));
  const t=el.querySelector(".tr"); t.dir=RTL.has(dst.c)?"rtl":"ltr"; t.lang=dst.c; t.textContent=tr;
  const rb=document.createElement("button"); rb.className="replay"; rb.setAttribute("aria-label","השמע שוב");
  rb.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>';
  rb.onclick=()=>say(tr,dst.c,true);
  el.appendChild(rb); $("main").scrollTop=$("main").scrollHeight;
}

// ---------- read aloud (best voice on the device) ----------
const synth=window.speechSynthesis||null;
let speechRate=1.05; try{ speechRate=parseFloat(localStorage.getItem("conv-rate"))||1.05; }catch(e){}
let speakOn=true, speaking=false, muteUntil=0, voices=[], watch=null;
const spoken=[];
function loadVoices(){ try{ voices=synth?synth.getVoices():[]; }catch(e){ voices=[]; } buildVoiceRow(); }
if(synth){ loadVoices(); synth.onvoiceschanged=loadVoices; }
function score(v){ const n=v.name||""; let s=0;
  if(/natural|neural/i.test(n)) s+=10; if(/online/i.test(n)) s+=6; if(/premium|enhanced|siri/i.test(n)) s+=6; if(/google/i.test(n)) s+=4;
  if(!v.localService) s+=2; if(/compact|espeak|robot|novelty/i.test(n)) s-=10; return s; }
function voiceFor(c){
  const vs=voices.filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith(c==="he"?"he":c)||(c==="he"&&(v.lang||"").toLowerCase().startsWith("iw")));
  return vs.sort((a,b)=>score(b)-score(a))[0]||null;
}
function buildVoiceRow(){
  const row=$("voiceRow"); if(!row) return;
  const va=voiceFor(A), vb=voiceFor(B);
  row.textContent="קול להקראה: "+L(A).n+" — "+(va?va.name:"אין קול במכשיר")+" · "+L(B).n+" — "+(vb?vb.name:"אין קול במכשיר");
}
function norm(t){ return (t||"").toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim(); }
function isEcho(t){
  const w=norm(t).split(" ").filter(Boolean); if(!w.length) return false;
  return spoken.some(s=>Date.now()-s.t<30000 && w.filter(x=>s.w.has(x)).length/w.length>=0.5);
}
function say(text,c,force){
  if((!speakOn&&!force)||!synth||!text) return;
  spoken.push({text,w:new Set(norm(text).split(" ")),t:Date.now()}); while(spoken.length>6) spoken.shift();
  try{ synth.cancel(); }catch(e){}
  pauseRec();
  speaking=true; setStatus("מקריא את התרגום…");
  const parts=(text.match(/[^.!?。！？؟\n]+[.!?。！？؟]*\s*/g)||[text]).map(s=>s.trim()).filter(Boolean);
  const v=voiceFor(c);
  const done=()=>{ clearTimeout(watch); if(!speaking) return; speaking=false; muteUntil=Date.now()+700; setTimeout(resumeRec,150); };
  clearTimeout(watch); watch=setTimeout(done,4000+text.length*120);
  parts.forEach((p,i)=>{ const u=new SpeechSynthesisUtterance(p); u.lang=L(c).sr; if(v) u.voice=v; u.rate=speechRate;
    if(i===parts.length-1) u.onend=done; u.onerror=done; synth.speak(u); });
}
$("rate").value=String(speechRate); if(!$("rate").value) $("rate").value="1.05";
$("rate").onchange=()=>{ speechRate=parseFloat($("rate").value); try{ localStorage.setItem("conv-rate",String(speechRate)); }catch(e){} };
$("speakBtn").onclick=e=>{ speakOn=!speakOn; e.currentTarget.setAttribute("aria-pressed",speakOn); if(!speakOn&&synth){ synth.cancel(); } };

// ---------- listening ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
let rec=null, listening=false, paused=false, expect="A", buf="", flushT=null, wakeLock=null;
if(!SR){ $("warn").hidden=false; $("mic").disabled=true; }
function paintExpect(){
  $("chipA").classList.toggle("expect",listening&&expect==="A");
  $("chipB").classList.toggle("expect",listening&&expect==="B");
  $("mic").classList.toggle("B",expect==="B");
  buildVoiceRow();
  if(listening&&!speaking) setStatus("מקשיב… (מצפה ל"+(expect==="A"?L(A).n:L(B).n)+", כל אחת מהשפות תזוהה)");
}
function setStatus(t){ $("status").textContent=t; }
function begin(){
  if(!SR||!listening||paused) return;
  rec=new SR(); rec.lang=L(langOf(expect)).sr; rec.continuous=!IS_IOS; rec.interimResults=true;
  rec.onresult=ev=>{
    if(paused||speaking||Date.now()<muteUntil) return;
    let interim="";
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const r=ev.results[i];
      if(r.isFinal){ buf+=" "+r[0].transcript; clearTimeout(flushT); flushT=setTimeout(flush,350); }
      else interim+=r[0].transcript;
    }
    $("partial").textContent=interim;
    if(interim) prefetch(interim);
    if(interim) clearTimeout(flushT);
  };
  rec.onerror=ev=>{ if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){ stop(); setStatus("אין הרשאה למיקרופון."); } };
  rec.onend=()=>{ rec=null; if(listening&&!paused) setTimeout(begin,IS_IOS?150:50); };
  try{ rec.start(); }catch(e){}
}
function restartRec(){ if(rec){ try{ rec.abort(); }catch(e){} } }  // onend restarts in the expected language
function pauseRec(){ paused=true; buf=""; clearTimeout(flushT); $("partial").textContent=""; if(rec){ try{ rec.abort(); }catch(e){} } }
function resumeRec(){ if(!listening) return; paused=false; paintExpect(); if(!rec) begin(); }
async function start(){
  if(!SR) return;
  listening=true; paused=false;
  if(synth){ try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; synth.speak(u); }catch(e){} }
  try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){}
  $("mic").classList.add("live"); $("mic").setAttribute("aria-pressed","true"); $("mic").setAttribute("aria-label","עצירת האזנה");
  paintExpect(); begin();
}
function stop(){
  listening=false; paused=false; if(rec){ try{ rec.stop(); }catch(e){} }
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock=null; }
  $("mic").classList.remove("live"); $("mic").setAttribute("aria-pressed","false"); $("mic").setAttribute("aria-label","התחלת האזנה");
  $("partial").textContent=""; paintExpect(); setStatus("מושהה. לחצו כדי להמשיך");
}
$("mic").onclick=()=> listening?stop():start();

let chain=Promise.resolve();
function flush(){
  clearTimeout(flushT);
  const text=buf.trim(); buf=""; $("partial").textContent="";
  if(!text||isEcho(text)) return;
  chain=chain.then(()=>handle(text));
}
async function handle(text){
  const el=bubble(expect);
  const key=$("apikey").value.trim();
  try{
    let r=null;
    if(key){
      const google=routeFree(text);
      const timeout=new Promise(res=>setTimeout(()=>res(null),2500));
      try{ r=await Promise.race([routeClaude(text,key),timeout]); }catch(e){ console.warn("Claude failed, using Google",e); }
      if(!r) r=await google;
    }
    if(!r) r=await routeFree(text);
    if(r.source==="echo"){ el.remove(); return; }
    const src=r.source==="B"?"B":"A";
    fillBubble(el,src,(r.original||text).trim(),(r.translation||"").trim());
    expect=other(src);      // the other person usually answers next
    paintExpect(); restartRec();
    say((r.translation||"").trim(), langOf(other(src)));
  }catch(e){
    el.className="bubble err "+expect; el.querySelector(".tr").textContent="שגיאת תרגום. בדקו את החיבור לאינטרנט.";
  }
}
$("clearBtn").onclick=()=>{ $("log").innerHTML='<div class="empty" id="empty">השיחה נוקתה. לחצו על המיקרופון כדי להמשיך.</div>'; };
document.addEventListener("visibilitychange",async()=>{ if(listening&&document.visibilityState==="visible"){ try{ wakeLock=await navigator.wakeLock.request("screen"); }catch(e){} } });
