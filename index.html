<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="תרגום חי">
<title>תרגום חי — עברית ← שפות זרות</title>
<link rel="preconnect" href="https://translate.googleapis.com" crossorigin>
<link rel="dns-prefetch" href="https://api.mymemory.translated.net">
<style>
  :root {
    --bg: #E6EAF0; --panel: #ffffff; --ink: #0F172A; --ink-dim: #475569; --ink-soft: #94A3B8;
    --accent: #2563EB; --accent-bg: #DBEAFE; --teal: #2563EB; --teal-bg: #DBEAFE;
    --line: rgba(15,23,42,.07); --red: #F87171; --dark: #0F172A; --well: #F4F6F9;
    --card: 0 1px 2px rgba(15,23,42,.05), 0 12px 32px -10px rgba(15,23,42,.18);
    --chip: 0 1px 2px rgba(15,23,42,.08), 0 6px 14px -6px rgba(15,23,42,.18);
    --txt: 30px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    display: flex; flex-direction: column; gap: 14px;
    padding: calc(14px + env(safe-area-inset-top)) 22px calc(14px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  button, select, input[type=password] {
    font: inherit; font-size: 15px; cursor: pointer; border: 0; border-radius: 14px; padding: 10px 16px; min-height: 44px;
    -webkit-appearance: none; appearance: none; background: var(--panel); color: var(--ink); box-shadow: var(--chip);
  }
  button:focus-visible, .langs label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* top bar */
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: relative; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo-box { background: #fff; border-radius: 14px; padding: 6px 12px; box-shadow: var(--chip); display: flex; }
  .brand .logo { height: 36px; width: auto; display: block; }
  .brand svg.logo { height: 42px; width: calc(42px * 192 / 66); cursor: pointer; }
  header h1 { font-size: 21px; font-weight: 700; margin: 0; }
  .ver { font-size: 12px; color: var(--ink-dim); background: #fff; border-radius: 999px; padding: 4px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; box-shadow: var(--chip); }
  #status { flex: 1; min-width: 140px; font-size: 14px; color: var(--ink-dim); display: flex; align-items: center; gap: 8px; }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #16A34A; flex-shrink: 0; }
  .langs { display: flex; gap: 4px; flex-wrap: wrap; background: #fff; border-radius: 16px; padding: 4px; box-shadow: var(--chip); }
  .langs label { padding: 9px 14px; border-radius: 12px; color: var(--ink-dim); cursor: pointer; user-select: none; font-size: 14px; min-height: 40px; display: flex; align-items: center; }
  .langs input { display: none; }
  .langs label:has(input:checked), .langs label.on { background: var(--accent-bg); color: #1E40AF; font-weight: 600; }
  #setbtn { width: 44px; padding: 0; display: flex; align-items: center; justify-content: center; }
  #settings { position: absolute; top: calc(100% + 10px); inset-inline-end: 0; background: #fff; border-radius: 18px; padding: 16px;
              box-shadow: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; min-width: 280px; }
  #settings[hidden] { display: none; }
  #settings select, #settings input { box-shadow: none; border: 1px solid #E2E8F0; width: 100%; }
  #settings input { direction: ltr; cursor: text; }
  #clear { color: #B91C1C; box-shadow: none; border: 1px solid #FECACA; }

  /* Hebrew source card */
  #panel-he { background: var(--panel); border-radius: 24px; padding: 16px 22px; display: flex; gap: 16px; align-items: flex-start;
              box-shadow: var(--card); border: 1px solid var(--line); cursor: pointer; direction: rtl; text-align: right; flex-shrink: 0; }
  #panel-he .badge { flex-shrink: 0; width: 46px; height: 46px; border-radius: 15px; background: var(--accent); display: flex; align-items: center; justify-content: center;
                     box-shadow: 0 6px 16px -4px var(--accent); }
  #panel-he .txt { flex: 1; min-width: 0; }
  #panel-he h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--accent); display: flex; gap: 8px; }
  #panel-he h2 .mic { color: var(--ink-soft); font-weight: 400; }
  #panel-he .current { font-size: calc(var(--txt) * .85); line-height: 1.4; font-weight: 500; min-height: 1.4em; max-height: 2.8em; overflow: hidden; }

  /* translation cards */
  .body { flex: 1; display: flex; gap: 14px; min-height: 0; }
  main { flex: 1; display: grid; gap: 14px; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); min-width: 0; min-height: 0; }
  section { background: var(--panel); border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 12px; min-height: 0;
            box-shadow: var(--card); border: 1px solid var(--line); }
  section h2 { margin: 0; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .tag { font-size: 14px; font-weight: 600; border-radius: 10px; padding: 6px 12px; background: #DBEAFE; color: #1E40AF; }
  [data-code="ru"] .tag { background: #FFEDD5; color: #9A3412; }
  [data-code="ar"] .tag { background: #DCFCE7; color: #166534; }
  [data-code="hi"] .tag { background: #FCE7F3; color: #9D174D; }
  [data-code="zh-CN"] .tag { background: #FEE2E2; color: #991B1B; }
  [data-code="th"] .tag { background: #EDE9FE; color: #5B21B6; }
  section h2 .mic { margin-inline-start: auto; font-size: 13px; font-weight: 400; color: #334155; background: #F1F5F9; border-radius: 12px; padding: 9px 13px; direction: rtl; }
  .current { font-size: calc(var(--txt) * 1.2); line-height: 1.3; font-weight: 600; min-height: 1.3em; overflow-y: auto; flex-shrink: 1; }
  .history { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: calc(var(--txt) * .5); line-height: 1.5; color: var(--ink-dim);
             overflow-y: auto; max-height: 38%; flex-shrink: 0; }
  .history p { margin: 0; background: var(--well); border-radius: 14px; padding: 9px 14px; box-shadow: inset 0 1px 2px rgba(15,23,42,.07); }
  .history:empty { display: none; }
  .interim { color: var(--ink-soft); font-weight: 500; }
  /* the panel whose language is being spoken: a still ring (no animation, lighter on the iPad) */
  .speaking { box-shadow: 0 0 0 3px var(--accent), var(--card) !important; }
  .ltr { direction: ltr; text-align: left; }
  .rtl { direction: rtl; text-align: right; }
  .empty { color: var(--ink-dim); padding: 40px; text-align: center; grid-column: 1 / -1; background: var(--panel); border-radius: 24px; box-shadow: var(--card); }
  .warn { padding: 12px 20px; background: #DC2626; color: #fff; display: none; border-radius: 14px; }

  /* transcript drawer */
  aside { width: 320px; flex-shrink: 0; background: var(--panel); border-radius: 24px; box-shadow: var(--card); border: 1px solid var(--line);
          display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  aside.collapsed { display: none; }
  aside .head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid #EEF1F5; }
  aside .head h2 { margin: 0; flex: 1; font-size: 14px; font-weight: 600; }
  aside .head .count { font-size: 12px; color: var(--ink-dim); white-space: nowrap; }
  aside .head button { font-size: 13px; padding: 8px 12px; min-height: 36px; box-shadow: none; background: #F1F5F9; }
  #transcript { flex: 1; overflow-y: auto; padding: 10px 16px; direction: rtl; text-align: right; -webkit-overflow-scrolling: touch; }
  #transcript p { margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px dashed #E2E8F0; font-size: 15px; line-height: 1.5; }
  #transcript time { display: block; font-size: 11px; color: var(--ink-dim); margin-bottom: 2px; }
  #transcript b { font-size: 12px; float: left; }
  #transcript .none { color: var(--ink-dim); font-size: 14px; padding: 16px 0; }

  /* bottom dock */
  .dock { display: flex; justify-content: center; align-items: center; gap: 12px; flex-shrink: 0; }
  .dock button { border-radius: 999px; padding: 12px 20px; min-height: 52px; }
  #toggle { background: var(--dark); color: #fff; font-size: 18px; font-weight: 600; padding: 14px 32px; min-height: 58px;
            box-shadow: 0 2px 4px rgba(15,23,42,.2), 0 14px 30px -8px rgba(15,23,42,.45); }
  #toggle::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #34D399; margin-inline-end: 10px; }
  #toggle.listening::before { border-radius: 3px; background: var(--red); }
  #toggle:disabled { opacity: .5; }
  .zoom { display: inline-flex; align-items: center; background: #fff; border-radius: 999px; box-shadow: var(--chip); }
  .zoom button { background: transparent; box-shadow: none; padding: 12px 16px; font-size: 17px; font-weight: 600; }
  .zoom span { font-size: 12px; color: var(--ink-dim); min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
  #tapResume { position: fixed; inset: auto 16px calc(100px + env(safe-area-inset-bottom)) 16px; z-index: 50;
               font-size: 22px; font-weight: 700; padding: 22px; border-radius: 22px; background: var(--accent); color: #fff;
               box-shadow: 0 14px 36px -8px rgba(15,23,42,.5); }
  #tapResume[hidden] { display: none; }

  @media (max-width: 900px) {
    body { overflow: auto; height: auto; min-height: 100dvh; }
    .body { flex-direction: column; }
    main { grid-template-columns: 1fr; }
    section { min-height: 40vh; }
    aside { width: auto; max-height: 50vh; }
  }
</style>
</head>

/* PCB logo: written as one continuous stroke with depth, plays once on load; tap the logo to replay */
(function(){
  const g = id => document.getElementById('pl-' + id);
  const T = { write0: 0.2, writeDur: 2.6, merge0: 2.85, mergeDur: 0.3, sheen0: 3.0, sheenDur: 0.8, text0: 3.05, textDur: 1.1 };
  const END = T.text0 + T.textDur;
  const clamp = x => Math.max(0, Math.min(1, x));
  const easeInOut = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
  const easeSine = x => -(Math.cos(Math.PI*x) - 1)/2;
  const stroke = g('stroke'), L = stroke.getTotalLength();
  stroke.style.strokeDasharray = L + ' ' + L;
  function setTime(t){
    const w = clamp((t - T.write0)/T.writeDur), e = easeSine(w);
    stroke.style.strokeDashoffset = L*(1-e);
    stroke.style.visibility = e > 0.0005 ? 'visible' : 'hidden';
    const pt = stroke.getPointAtLength(L*e), pen = g('pen');
    pen.setAttribute('cx', pt.x); pen.setAttribute('cy', pt.y);
    pen.setAttribute('opacity', w > 0 && w < 1 ? 1 : clamp(1 - (t - T.write0 - T.writeDur)/0.25));
    const m = clamp((t - T.merge0)/T.mergeDur);

    g('edgeGlow').setAttribute('opacity', r > 0 && r < 1 ? Math.sin(Math.PI*r) : 0);

  }

    cancelAnimationFrame(raf);

      const t = (now - t0)/1000;

  }

})();
const LANGS = [
  { code: 'en', name: 'English', label: 'אנגלית', dir: 'ltr', speech: 'en-US', google: 'en', full: 'English' },

// ---- translation engines ----
async function translateGoogle(text, to, from) {
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + langOf(from).google + '&tl=' + langOf(to).google + '&dt=t&q=' + encodeURIComponent(text);
  const res = await fetch(url);
  if (!res.ok) throw new Error('Google ' + res.status);
  const data = await res.json();
  return data[0].map(x => x[0]).join('');
}

// Backup engine (free, no key) used automatically when Google is blocked or fails.
async function translateMyMemory(text, to, from) {
  const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + from + '|' + to;
  const res = await fetch(url);
  if (!res.ok) throw new Error('MyMemory ' + res.status);
  const data = await res.json();
  if (!data.responseData || !data.responseData.translatedText) throw new Error('MyMemory: ' + (data.responseDetails || 'no result'));
  return data.responseData.translatedText;
}

const trCache = new Map();
function translateFree(text, to, from) {
  const key = from + '|' + to + '|' + text.trim().toLowerCase();
  if (trCache.has(key)) return trCache.get(key);
  const p = translateFreeRaw(text, to, from);
  trCache.set(key, p); p.catch(() => trCache.delete(key));
  if (trCache.size > 200) trCache.delete(trCache.keys().next().value);
  return p;
}
async function translateFreeRaw(text, to, from) {
  try { return await translateGoogle(text, to, from); }
  catch (e1) {
    console.warn('Google failed, trying backup:', e1.message);
    try { return await translateMyMemory(text, to, from); }
    catch (e2) { throw new Error(e1.message + ' / ' + e2.message); }
  }
}

async function translateClaude(text, codes, from) {
  const key = $('apikey').value.trim();
  if (!key) throw new Error('חסר מפתח API');
  const names = { he: 'Hebrew', en: 'English', ru: 'Russian', ar: 'Arabic', hi: 'Hindi', 'zh-CN': 'Simplified Chinese', th: 'Thai' };
  const shape = '{' + codes.map(c => `"${c}":"..."`).join(',') + '}';
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json", "x-api-key": key,
      "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6", max_tokens: 1500,
      system: `You are a live interpreter. Translate the ${names[from]} text into natural ${codes.map(c => names[c]).join(', ')}. Respond ONLY with JSON of the form ${shape} — no preamble, no markdown fences.`,
      messages: [{ role: "user", content: text }]
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  const raw = data.content.map(c => c.text || "").join("").replace(/```json|```/g, "").trim();
  return JSON.parse(raw);
}

async function translate(text, codes, from) {
  if ($('engine').value === 'claude') return translateClaude(text, codes, from);
  const out = {};
  await Promise.all(codes.map(async c => { out[c] = await translateFree(text, c, from); }));
  return out;
}
// everything except the language being spoken: Hebrew + the selected languages
function targetsFor(from) {
  const t = from === 'he' ? [] : ['he'];
  return t.concat(selected.filter(c => c !== from));
}

// ---- live preview while still speaking (Google only, fast) ----
let previewTimer = null, previewSeq = 0, finalSeq = 0;
function previewTranslate(text) {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    const from = inputLang, seq = ++previewSeq, codes = targetsFor(from);
    try {
      const out = {};
      await Promise.all(codes.map(async c => { out[c] = await translateFree(text, c, from); }));
      if (seq !== previewSeq || finalSeq > 0 && seq < finalSeq) return;   // stale
      codes.forEach(c => { const el = $('cur-' + c); if (el) el.innerHTML = `<span class="interim">${out[c]}</span>`; });
    } catch (e) {}
  }, 120);
}

const transcript = [];

// ---- flow ----
function pushHistory(code, text) {
  const h = $('hist-' + code); if (!h) return;
  const p = document.createElement('p'); p.textContent = text;
  h.prepend(p);
  while (h.children.length > 20) h.lastChild.remove();   // keep the page light during long sessions
}


async function handleFinal(text) {
  text = text.trim(); if (!text) return;
  const from = inputLang, codes = targetsFor(from);
  clearTimeout(previewTimer); finalSeq = ++previewSeq;
  const src = $('cur-' + from); if (src) src.textContent = text;
  if (from !== 'he') pushHistory(from, text);
  const entry = { time: new Date(), lang: from, he: from === 'he' ? text : '…', tr: { [from]: text } };
  try {
    const t = await translate(text, codes, from);
    Object.assign(entry.tr, t);
    if (from !== 'he') entry.he = t.he || '';
    addToTranscript(entry);
    codes.forEach(c => { const el = $('cur-' + c); if (el) el.textContent = t[c] || ''; pushHistory(c, t[c] || ''); });
  } catch (e) {
    addToTranscript(entry);
    codes.forEach(c => { const el = $('cur-' + c); if (el) el.textContent = 'שגיאת תרגום: ' + e.message; });
    $('status').textContent = 'שגיאת תרגום: ' + e.message + ' — בדוק חיבור לאינטרנט';

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // On iPad/iPhone, Safari handles the permission itself and an open stream would block recognition.

    if (recStarting && !recRunning) {        // never started
      recStarting = false;
      if (IS_IOS && heardOnce && ++failedStarts >= 2) askTap();
    }
  }, 2000);
}
// Safari on iPad sometimes refuses to reopen the microphone without a touch. Then one tap anywhere continues.
function askTap() {
  if (!listening || needTap) return;
  needTap = true; recStarting = false;
  $('tapResume').hidden = false;
  $('status').textContent = 'גע במסך כדי להמשיך להקשיב.';
}
function resumeFromTap(e) {
  if (!needTap) return;
  e.preventDefault(); e.stopPropagation();
  needTap = false; failedStarts = 0; $('tapResume').hidden = true;
  $('status').textContent = 'מקשיב… דבר ב' + langOf(inputLang).label + '.';
  restartFresh();   // a new recognizer, started inside this touch
}
document.addEventListener('pointerdown', resumeFromTap, true);
function stop() {
  clearInterval(recGuard); clearTimeout(freshWatch); needTap = false; $('tapResume').hidden = true;
  listening = false; rec && rec.stop();
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
  $('toggle').textContent = 'התחל להקשיב'; $('toggle').classList.remove('listening');
  $('status').textContent = 'מושהה.';
}
$('toggle').onclick = () => listening ? stop() : start();
$('clear').onclick = () => {
  if (transcript.length && !confirm('לנקות את המסך ואת התמלול המלא? (מומלץ לייצא ל‑Word קודם)')) return;
  document.querySelectorAll('.current, .history').forEach(el => el.textContent = '');
  clearTranscript();
};

// ---- text size ----
let zoom = parseInt(localStorage.getItem('zoom') || '100', 10);
function applyZoom() {
  zoom = Math.min(250, Math.max(50, zoom));
  document.documentElement.style.setProperty('--txt', (30 * zoom / 100) + 'px');
  $('zoomVal').textContent = zoom + '%';
  localStorage.setItem('zoom', zoom);
}
$('zoomIn').onclick = () => { zoom += 10; applyZoom(); };
$('zoomOut').onclick = () => { zoom -= 10; applyZoom(); };
applyZoom();

// ---- settings ----
$('engine').value = localStorage.getItem('engine') || 'google';
$('apikey').value = localStorage.getItem('apikey') || '';
function syncEngine() {
  $('apikey').style.display = $('engine').value === 'claude' ? '' : 'none';
  localStorage.setItem('engine', $('engine').value);
}
$('engine').onchange = syncEngine; syncEngine();
// settings popover
function setSettings(open) { $('settings').hidden = !open; $('setbtn').setAttribute('aria-expanded', open ? 'true' : 'false'); }
$('setbtn').onclick = e => { e.stopPropagation(); setSettings($('settings').hidden); };
$('settings').onclick = e => e.stopPropagation();
document.addEventListener('click', () => { if (!$('settings').hidden) setSettings(false); });
$('apikey').onchange = () => localStorage.setItem('apikey', $('apikey').value.trim());
</script>
</body>
</html>
