<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="תרגום חי">
<title>תרגום חי — עברית ← שפות זרות</title>
<style>
  :root {
    --bg: #f9f7f4; --panel: #ffffff; --ink: #1a1f2e; --ink-dim: #7a8494;
    --accent: #8b634b; --accent-bg: #f5ece4; --teal: #0f8b8c; --teal-bg: #e2f4f4;
    --line: #e2dcd6; --red: #d1403a;
    --shadow: 0 6px 20px rgba(20,18,15,.14), 0 2px 6px rgba(20,18,15,.09);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif; display: flex; flex-direction: column;
    background-image:
      linear-gradient(to right, rgba(232,226,218,0.3) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(232,226,218,0.3) 1px, transparent 1px);
    background-size: 32px 32px; background-attachment: fixed;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: #ffffff;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 24px; border-bottom: 1px solid var(--line);
    box-shadow: 0 2px 12px rgba(20,18,15,.06);
  }
  header h1 { font-size: 18px; font-weight: 800; margin: 0; letter-spacing: -.3px; }
  .logo { height: 44px; width: auto; margin-inline-start: auto; order: 99; }
  #status { color: var(--ink-dim); font-size: 14px; flex: 1; }
  .langs { display: flex; gap: 6px; flex-wrap: wrap; }
  .langs label {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--ink-dim); cursor: pointer; user-select: none; font-size: 14px; background: #fff;
  }
  .langs input { display: none; }
  .langs input:checked + span { color: var(--teal); font-weight: 600; }
  .langs label:has(input:checked), .langs label.on { border-color: var(--teal); background: var(--teal-bg); }
  button, select, input[type=password] {
    font: inherit; font-size: 16px; font-weight: 500; cursor: pointer; border: 0; border-radius: 999px; padding: 9px 20px;
    -webkit-appearance: none; appearance: none;
  }
  button { background: var(--teal); color: #fff; }
  button:focus-visible, .langs label:focus-within { outline: 3px solid var(--ink); outline-offset: 2px; }
  button.listening { background: var(--red); }
  button.listening::before {
    content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: #fff; margin-inline-end: 8px; animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { button.listening::before { animation: none; } }
  .ghost, select, input[type=password] { background: #fff; color: var(--ink); border: 1px solid var(--line); font-weight: 400; }
  input[type=password] { width: 230px; direction: ltr; cursor: text; }

  .body { flex: 1; display: flex; min-height: 0; }
  main { flex: 1; display: grid; gap: 1px; background: var(--line); grid-template-columns: repeat(var(--cols, 2), 1fr); min-width: 0; }
  aside {
    width: 300px; flex-shrink: 0; background: var(--panel); border-inline-end: 1px solid var(--line);
    display: flex; flex-direction: column; max-height: calc(100vh - 140px); position: sticky; top: 68px;
  }
  aside .head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  aside .head h2 { margin: 0; flex: 1; font-size: 13px; font-weight: 600; color: var(--ink-dim); }
  aside .head .count { font-size: 12px; color: var(--ink-dim); }
  aside .head button { padding: 6px 12px; font-size: 13px; }
  #transcript { flex: 1; overflow-y: auto; padding: 8px 16px; direction: rtl; text-align: right; }
  #transcript p { margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); font-size: 15px; line-height: 1.5; }
  #transcript p:last-child { border-bottom: 0; }
  #transcript time { display: block; font-size: 11px; color: var(--ink-dim); margin-bottom: 2px; }
  #transcript .none { color: var(--ink-dim); font-size: 14px; padding: 16px 0; }
  @media (max-width: 900px) {
    .body { flex-direction: column; }
    main { grid-template-columns: 1fr; }
    aside { width: auto; max-height: 40vh; position: static; border-inline-end: 0; border-top: 1px solid var(--line); order: 2; }
  }
  footer {
    position: sticky; bottom: 0; background: var(--accent-bg); border-top: 3px solid var(--accent);
    padding: 16px 24px calc(16px + env(safe-area-inset-bottom)); direction: rtl; text-align: right; box-shadow: 0 -2px 12px rgba(20,18,15,.06);
  }
  footer h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--accent); }
  footer .current { font-size: 34px; min-height: 1.4em; }
  footer .history { margin-top: 8px; padding-top: 8px; font-size: 15px; max-height: 3.2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer .history p { display: inline; margin: 0 0 0 24px; }
  section { background: var(--panel); padding: 24px; display: flex; flex-direction: column; min-height: 40vh; }
  section h2 { margin: 0 0 16px; font-size: 13px; font-weight: 600; color: var(--ink-dim);
               border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .current { font-size: 30px; line-height: 1.4; font-weight: 500; min-height: 3em; }
  .interim { color: var(--ink-dim); font-weight: 400; }
  .current { font-weight: 600; }
  .history { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--ink-dim);
             font-size: 17px; line-height: 1.55; overflow-y: auto; max-height: 45vh; }
  .history p { margin: 0 0 12px; }
  .ltr { direction: ltr; text-align: left; }
  .rtl { direction: rtl; text-align: right; }
  .empty { color: var(--ink-dim); padding: 40px; text-align: center; grid-column: 1 / -1; background: var(--panel); }
  .warn { padding: 12px 24px; background: var(--red); color: #fff; display: none; }
</style>
</head>

      <h2>תמלול מלא — עברית</h2>

</div>
<footer>

<script>
const $ = id => document.getElementById(id);
const LANGS = [
  { code: 'en', name: 'English', label: 'אנגלית', dir: 'ltr' },
  { code: 'ru', name: 'Русский', label: 'רוסית',  dir: 'ltr' },
  { code: 'ar', name: 'العربية', label: 'ערבית',  dir: 'rtl' },
  { code: 'hi', name: 'हिन्दी',  label: 'הינדית', dir: 'ltr' },
  { code: 'zh-CN', name: '中文', label: 'סינית', dir: 'ltr' },
];
let selected = JSON.parse(localStorage.getItem('langs') || '["en","ru"]');

// ---- language picker ----
LANGS.forEach(l => {
  const lab = document.createElement('label');
  lab.innerHTML = `<input type="checkbox" value="${l.code}" ${selected.includes(l.code) ? 'checked' : ''}><span>${l.label}</span>`;
  lab.classList.toggle('on', selected.includes(l.code));
  lab.querySelector('input').onchange = () => {
    lab.classList.toggle('on', lab.querySelector('input').checked);
    selected = [...$('langs').querySelectorAll('input:checked')].map(i => i.value);
    localStorage.setItem('langs', JSON.stringify(selected));
    buildPanels();
  };
  $('langs').appendChild(lab);
});

// ---- panels ----
function panel(code, title, dir) {
  return `<section class="${dir}"><h2>${title}</h2>
    <div class="current" id="cur-${code}"></div>
    <div class="history" id="hist-${code}"></div></section>`;
}
function buildPanels() {
  const active = LANGS.filter(l => selected.includes(l.code));
  $('main').style.setProperty('--cols', Math.max(1, active.length));
  $('main').innerHTML = active.map(l => panel(l.code, l.name, l.dir)).join('')
    + (active.length ? '' : '<div class="empty">בחר לפחות שפת תרגום אחת למעלה.</div>');
}
buildPanels();

// ---- translation engines ----
async function translateGoogle(text, to) {
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=iw&tl=' + to + '&dt=t&q=' + encodeURIComponent(text);
  const data = await (await fetch(url)).json();
  return data[0].map(x => x[0]).join('');
}

async function translateClaude(text, codes) {
  const key = $('apikey').value.trim();
  if (!key) throw new Error('חסר מפתח API');
  const names = { en: 'English', ru: 'Russian', ar: 'Arabic', hi: 'Hindi', 'zh-CN': 'Simplified Chinese' };
  const shape = '{' + codes.map(c => `"${c}":"..."`).join(',') + '}';
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json", "x-api-key": key,
      "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6", max_tokens: 1500,
      system: `You are a live interpreter. Translate the Hebrew text into natural ${codes.map(c => names[c]).join(', ')}. Respond ONLY with JSON of the form ${shape} — no preamble, no markdown fences.`,
      messages: [{ role: "user", content: text }]
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  const raw = data.content.map(c => c.text || "").join("").replace(/```json|```/g, "").trim();
  return JSON.parse(raw);
}

async function translate(text, codes) {
  if ($('engine').value === 'claude') return translateClaude(text, codes);
  const out = {};
  await Promise.all(codes.map(async c => { out[c] = await translateGoogle(text, c); }));
  return out;
}

// ---- live preview while still speaking (Google only, fast) ----
let previewTimer = null, previewSeq = 0, finalSeq = 0;
function previewTranslate(text) {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    const seq = ++previewSeq, codes = [...selected];
    try {
      const out = {};
      await Promise.all(codes.map(async c => { out[c] = await translateGoogle(text, c); }));
      if (seq !== previewSeq || finalSeq > 0 && seq < finalSeq) return;   // stale
      codes.forEach(c => { const el = $('cur-' + c); if (el) el.innerHTML = `<span class="interim">${out[c]}</span>`; });
    } catch (e) {}
  }, 250);
}

// ---- transcript (full Hebrew log + translations) ----
const transcript = [];
function addToTranscript(entry) {
  transcript.push(entry);
  const box = $('transcript');
  const none = box.querySelector('.none'); if (none) none.remove();
  const p = document.createElement('p');
  const t = document.createElement('time'); t.textContent = entry.time.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  p.appendChild(t); p.appendChild(document.createTextNode(entry.he));
  box.appendChild(p);
  box.scrollTop = box.scrollHeight;
  $('tcount').textContent = transcript.length + ' משפטים';
}
function clearTranscript() {
  transcript.length = 0;
  $('transcript').innerHTML = '<div class="none">כאן יופיע כל מה שנאמר, לפי הסדר.</div>';
  $('tcount').textContent = '0 משפטים';
}
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function exportWord() {
  if (!transcript.length) { alert('אין עדיין תוכן לייצוא.'); return; }
  const langs = LANGS.filter(l => transcript.some(e => e.tr && e.tr[l.code]));
  const d = new Date();
  const title = 'תמלול שיחה — ' + d.toLocaleDateString('he-IL');
  let rows = '';
  transcript.forEach((e, i) => {
    const time = e.time.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    rows += `<tr><td class="n">${i + 1}</td><td class="n">${time}</td><td class="he">${esc(e.he)}</td>`
          + langs.map(l => `<td class="${l.dir}">${esc((e.tr && e.tr[l.code]) || '')}</td>`).join('') + '</tr>';
  });
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>${esc(title)}</title>

</style></head><body>
<h1>${esc(title)}</h1>
<p class="meta">נוצר ב‑${d.toLocaleString('he-IL')} · ${transcript.length} משפטים</p>
<table dir="rtl"><thead><tr><th>#</th><th>שעה</th><th>עברית</th>${langs.map(l => `<th>${esc(l.name)}</th>`).join('')}</tr></thead>
<tbody>${rows}</tbody></table>
</body></html>`;
  const blob = new Blob(['\ufeff', html], { type: 'application/msword;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'transcript-' + d.toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.doc';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('export').onclick = exportWord;

// ---- flow ----
function pushHistory(code, text) {
  const h = $('hist-' + code); if (!h) return;
  const p = document.createElement('p'); p.textContent = text; h.prepend(p);
}

async function handleFinal(text) {
  text = text.trim(); if (!text) return;
  const codes = [...selected];
  clearTimeout(previewTimer); finalSeq = ++previewSeq;
  $('cur-he').textContent = text;
  const entry = { time: new Date(), he: text, tr: {} };
  addToTranscript(entry);
  try {
    const t = await translate(text, codes);
    entry.tr = t;
    pushHistory('he', text);
    codes.forEach(c => { const el = $('cur-' + c); if (el) el.textContent = t[c] || ''; pushHistory(c, t[c] || ''); });
  } catch (e) {
    codes.forEach(c => { const el = $('cur-' + c); if (el) el.textContent = 'שגיאת תרגום: ' + e.message; });
    console.error(e);
  }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let rec = null, listening = false, micStream = null, wakeLock = null;

async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (listening && document.visibilityState === 'visible') keepAwake(); });
if (!SR) { $('warn').style.display = 'block'; $('toggle').disabled = true; }

async function start() {
  // On desktop, keep the microphone open for the whole session so the browser asks once.
  // On iPad/iPhone, Safari handles the permission itself and an open stream would block recognition.
  if (!IS_IOS) {
    try { micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { $('status').textContent = 'אין גישה למיקרופון: ' + e.message; return; }
  }
  keepAwake();
  rec = new SR();
  rec.lang = 'he-IL'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) handleFinal(r[0].transcript); else interim += r[0].transcript;
    }
    if (interim) { $('cur-he').innerHTML = `<span class="interim">${interim}</span>`; previewTranslate(interim); }
  };
  rec.onerror = ev => {
    if (ev.error === 'no-speech' || ev.error === 'aborted') return;   // harmless on Safari
    $('status').textContent = 'שגיאה: ' + ev.error;
  };
  // Safari on iPad stops after every sentence — restart with a short delay (immediate restart throws).
  rec.onend = () => { if (listening) setTimeout(() => { try { rec.start(); } catch (e) {} }, IS_IOS ? 150 : 0); };
  rec.start();
  listening = true;
  $('toggle').textContent = 'עצור'; $('toggle').classList.add('listening');
  $('status').textContent = 'מקשיב… דבר בעברית.';
}
function stop() {
  listening = false; rec && rec.stop();
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
  $('toggle').textContent = 'התחל להקשיב'; $('toggle').classList.remove('listening');
  $('status').textContent = 'מושהה.';
}
$('toggle').onclick = () => listening ? stop() : start();
$('clear').onclick = () => {
  if (transcript.length && !confirm('לנקות את המסך ואת התמלול המלא? (מומלץ לייצא ל‑Word קודם)')) return;
  document.querySelectorAll('.current, .history').forEach(el => el.textContent = '');
  clearTranscript();
};

// ---- settings ----
$('engine').value = localStorage.getItem('engine') || 'google';
$('apikey').value = localStorage.getItem('apikey') || '';
function syncEngine() {
  $('apikey').style.display = $('engine').value === 'claude' ? '' : 'none';
  localStorage.setItem('engine', $('engine').value);
}
$('engine').onchange = syncEngine; syncEngine();
$('apikey').onchange = () => localStorage.setItem('apikey', $('apikey').value.trim());
</script>
